[project]
name = "insightful-report-agent"
version = "0.1.0.dev0"
description = "Source-grounded reports across large document and media collections, built on Deep Agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["reports", "documents", "deep-agents", "feishu", "slack", "a2a"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "managed-deepagents>=0.9.4,<0.11",
    "deepagents[video]>=0.7.29,<0.8",
    # `langchain.mcp.MCPAdapter` is the MCP client MDA itself uses; the extra brings FastMCP.
    "langchain[mcp]>=1.4.6,<1.5",
    "langchain-core>=1.6.12,<1.8",
    "langgraph>=1.2.16,<1.3",
    "langsmith>=0.14.11,<0.15",
    # MDA builds install core dependencies only, so both default providers live here.
    "langchain-anthropic>=1.7.6,<2",
    "langchain-openai>=1.7.2,<2",
    "httpx>=0.28.1,<1",
    "beautifulsoup4>=4.14,<5",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "click>=8.2,<9",
    # LangChain does not validate dict-form JSON schema tool arguments; the host guard does.
    "jsonschema>=4.23,<5",
    # Image clamp, contact sheets and the look tool's resize.
    "pillow>=12,<14",
    # Self-hosted API, Paper bridge and the optional local setup console.
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "python-multipart>=0.0.20,<1",
    # PEP 615: zoneinfo needs IANA time zone data on Windows.
    "tzdata>=2024.1; sys_platform == 'win32'",
    "a2a-sdk[http-server]==1.3.0",
    "langfuse>=4,<5",
    "opentelemetry-api>=1.45,<2",
]

[project.scripts]
insightful-report-agent = "insightful_report_agent.cli:main"

[project.optional-dependencies]
# Self-hosted path: Postgres persistence and the production ASGI server.
self-host = [
    "langgraph-checkpoint-postgres>=3.2,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "uvicorn[standard]>=0.35,<1",
]
slack = ["slack-bolt>=1.30,<2", "slack-sdk>=3.45,<4", "aiohttp>=3.9,<4"]
feishu = ["lark-oapi>=1.7.5,<2"]
# Extra model providers. Each adds a `provider:` prefix for INSIGHTFUL_REPORT_AGENT_MODEL.
google = ["langchain-google-genai>=4,<5"]
groq = ["langchain-groq>=1,<2"]
mistral = ["langchain-mistralai>=1,<2"]

[dependency-groups]
dev = [
    "mypy>=1.17,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "render: needs the sandbox image (docker); run by the CI render job",
    "live: calls a live provider; needs INSIGHTFUL_REPORT_AGENT_LIVE_TESTS=1",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "TID", "ARG", "S", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S603", "S607", "ARG001", "ARG002", "ARG005"]
# Paths inside the sandbox container, not this host's temp directory.
"src/insightful_report_agent/runtime/sandbox/*" = ["S108"]
"src/insightful_report_agent/middleware/workspace.py" = ["S108"]
"workspace/tools/**" = ["S603"]
"src/insightful_report_agent/cli.py" = ["S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
